<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>AUNE-A UI Layout Demo</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../src/styles/index.css"/>

    <style>
        body {
            background: var(--app-background);
            color: var(--app-text-primary);
            font-family: var(--font-family-base);
            padding: var(--spacing-stack-xl);
        }

        h2 {
            margin: var(--spacing-stack-lg) 0 var(--spacing-stack-md);
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-stack-md);
            align-items: center;
        }

        .section {
            margin-bottom: var(--spacing-stack-2xl);
        }
    </style>
</head>

<body>

<h1>AUNE-A • Button System</h1>

<!-- ========================= -->
<!-- LIGHT/DARK THEME -->
<!-- ========================= -->
<button id="theme-toggle" class="ui-button ui-button--outline ui-button--sm">
    Toggle theme
</button>

<script type="module">
    import { initThemeToggle } from './theme.js';

    const toggleTheme = initThemeToggle();

    document
        .getElementById('theme-toggle')
        .addEventListener('click', toggleTheme);
</script>

<!-- ========================= -->
<!-- SOLID BUTTONS -->
<!-- ========================= -->

<section class="section">
    <h2>Solid buttons</h2>
    <div class="row">
        <button class="ui-button ui-button--solid ui-button--main ui-button--md">Main</button>
        <button class="ui-button ui-button--solid ui-button--success ui-button--md">Success</button>
        <button class="ui-button ui-button--solid ui-button--warning ui-button--md">Warning</button>
        <button class="ui-button ui-button--solid ui-button--danger ui-button--md">Danger</button>
        <button class="ui-button ui-button--solid ui-button--processing ui-button--md">Processing</button>
        <button class="ui-button ui-button--solid ui-button--gray ui-button--md">Gray</button>
        <button class="ui-button ui-button--solid ui-button--all-state ui-button--md">All state</button>
    </div>
</section>

<!-- ========================= -->
<!-- OUTLINE BUTTONS -->
<!-- ========================= -->

<section class="section">
    <h2>Outline buttons</h2>
    <div class="row">
        <button class="ui-button ui-button--outline ui-button--main ui-button--md">Main</button>
        <button class="ui-button ui-button--outline ui-button--success ui-button--md">Success</button>
        <button class="ui-button ui-button--outline ui-button--warning ui-button--md">Warning</button>
        <button class="ui-button ui-button--outline ui-button--danger ui-button--md">Danger</button>
        <button class="ui-button ui-button--outline ui-button--processing ui-button--md">Processing</button>
        <button class="ui-button ui-button--outline ui-button--all-state ui-button--md">All state</button>
    </div>
</section>

<!-- ========================= -->
<!-- GHOST BUTTONS -->
<!-- ========================= -->

<section class="section">
    <h2>Ghost buttons</h2>
    <div class="row">
        <button class="ui-button ui-button--ghost ui-button--main ui-button--md">Ghost main</button>
        <button class="ui-button ui-button--ghost ui-button--success ui-button--md">Ghost success</button>
        <button class="ui-button ui-button--ghost ui-button--warning ui-button--md">Ghost warning</button>
        <button class="ui-button ui-button--ghost ui-button--danger ui-button--md">Ghost danger</button>
        <button class="ui-button ui-button--ghost ui-button--processing ui-button--md">Ghost processing</button>
        <button class="ui-button ui-button--ghost ui-button--all-state ui-button--md">Ghost all state</button>
    </div>
</section>

<!-- ========================= -->
<!-- SIZES -->
<!-- ========================= -->

<section class="section">
    <h2>Sizes</h2>
    <div class="row">
        <button class="ui-button ui-button--solid ui-button--main ui-button--sm">Small</button>
        <button class="ui-button ui-button--solid ui-button--main ui-button--md">Medium</button>
        <button class="ui-button ui-button--solid ui-button--main ui-button--lg">Large</button>
    </div>
</section>

<!-- ========================= -->
<!-- ROUND BUTTONS -->
<!-- ========================= -->

<section class="section">
    <h2>Round buttons</h2>
    <div class="row">
        <button class="ui-button ui-button--solid ui-button--all-state ui-button--round ui-button--lg">
            🎤
        </button>

        <button class="ui-button ui-button--outline ui-button--all-state ui-button--round ui-button--md">
            texto
        </button>

        <button class="ui-button ui-button--ghost ui-button--all-state ui-button--round ui-button--sm">
            ✕
        </button>
    </div>
</section>

<!-- ========================= -->
<!-- DISABLED -->
<!-- ========================= -->

<section class="section">
    <h2>Disabled</h2>
    <div class="row">
        <button class="ui-button ui-button--solid ui-button--main ui-button--md" disabled>
            Main disabled
        </button>
        <button class="ui-button ui-button--solid ui-button--all-state ui-button--md" disabled>
            All state disabled
        </button>
    </div>
</section>

</body>
</html>
